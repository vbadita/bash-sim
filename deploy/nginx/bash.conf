# /etc/nginx/apps.badita.com.d/bash.conf  (inside the apps.badita.com server {})
# Static site: /srv/bash-sim/bash is a symlink to the live release (bash-site-sync).
# The whole simulator runs in the browser; no code runs here per visitor.

location = /bash { return 301 /bash/; }

location = /bash/ {
    root /srv/bash-sim;
    try_files /bash/index.html =404;
    charset utf-8;
    include /etc/nginx/apps.badita.com.d/bash-headers.inc;
    # no-cache: revalidate (ETag) so a deploy shows at once; no-transform keeps
    # Cloudflare from injecting scripts (the CSP would block them anyway).
    add_header Cache-Control "no-cache, no-transform" always;
}

location /bash/ {
    root /srv/bash-sim;
    try_files $uri =404;                    # only files that exist; no directory listing
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain;
    types {
        text/html                html;
        text/css                 css;
        application/javascript   js mjs;
        image/svg+xml            svg;
        application/json         json;
        text/plain               flf txt;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    include /etc/nginx/apps.badita.com.d/bash-headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
}
